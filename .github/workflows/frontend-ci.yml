name: Frontend CI

on:
  push:
    branches: ["main", "master", "testing"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

  # Nota: el repo de GitHub tiene el código en la raíz (package.json, src/, e2e/),
  # así que los comandos corren en la raíz del checkout (sin working-directory).

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enable Corepack (Yarn Berry)
        run: corepack enable

      - name: Cache Yarn and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            **/node_modules
            .yarn/cache
            .yarn/install-state.gz
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install dependencies (immutable)
        run: yarn install --immutable

      # El repo tiene ~28 errores y ~49 warnings preexistentes. Para no bloquear
      # el CI mientras se remedia la deuda, linteamos solo los archivos tocados.
      - name: Get changed frontend files
        id: changed
        run: |
          git fetch origin ${{ github.base_ref || github.event.repository.default_branch }} --depth=1 || true
          BASE="${{ github.base_ref || github.event.repository.default_branch }}"
          files=$(git diff --name-only --diff-filter=ACMRT "origin/$BASE...HEAD" | grep -E '^src/.*\.(ts|tsx)$' | tr '\n' ' ' || true)
          echo "files=$files" >> $GITHUB_OUTPUT

      - name: Lint changed files
        if: steps.changed.outputs.files != ''
        run: yarn lint ${{ steps.changed.outputs.files }}

      - name: Run unit tests
        run: yarn vitest run --coverage

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: vitest-coverage
          path: coverage

      - name: Build
        run: yarn build

      - name: Install Playwright browsers
        run: yarn dlx playwright install --with-deps

      - name: Run E2E tests (Playwright)
        run: |
          # Ejecuta E2E con servidor Next y espera hasta que esté listo
          yarn ci:e2e

  security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secret scanning (trufflehog)
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --fail --no-verification
